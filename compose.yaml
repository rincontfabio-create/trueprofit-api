# docker compose up --build
#   API:       http://localhost:8000/docs
#   Interfaz:  http://localhost:8501   <- esta es la que se publica con cloudflared
services:
  api:
    build:
      context: .
      target: api
    image: trueprofit-api
    env_file: .env
    ports:
      - "8000:8000"

  ui:
    build:
      context: .
      target: ui
    image: trueprofit-ui
    env_file: .env
    environment:
      # Dentro de la red de Compose la API se llama "api"
      TRUEPROFIT_API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
