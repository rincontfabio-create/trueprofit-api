[project]
name = "trueprofit-api"
version = "0.1.0"
description = "API y app web para calcular la utilidad real de una tienda de dropshipping (Dropi + pauta)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]

[dependency-groups]
# Solo la interfaz web la necesita; la imagen de la API no la instala.
ui = [
    "streamlit>=1.38",
    "httpx>=0.27",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "httpx>=0.27",
]

[tool.uv]
# `uv sync` en desarrollo instala todo; el Dockerfile elige los grupos que necesita.
default-groups = ["dev", "ui"]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trueprofit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Aviso interno de Starlette sobre el cliente de pruebas; no afecta a la aplicación.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
