name: CI

on:
  push:
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Instalar entorno exacto (uv.lock)
        run: uv sync --frozen
      - name: Ruff (linting)
        run: uv run ruff check .
      - name: Ruff (formato)
        run: uv run ruff format --check .
      - name: Pruebas
        run: uv run pytest

  docker:
    runs-on: ubuntu-latest
    needs: verificar
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagen de la API
        run: docker build --target api -t trueprofit-api .
      - name: Construir imagen de la interfaz
        run: docker build --target ui -t trueprofit-ui .
      - name: Probar /health dentro del contenedor
        run: |
          docker run -d --name api -p 8000:8000 -e TRUEPROFIT_API_KEY=ci trueprofit-api
          for i in $(seq 1 20); do curl -fs localhost:8000/health && exit 0; sleep 1; done
          docker logs api; exit 1
